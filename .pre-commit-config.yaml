repos:
- repo: https://github.com/JohnnyMorganz/StyLua
  rev: v2.3.1
  hooks:
    - id: stylua 


- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.1.5
  hooks:
    - id: ruff
      args: [--fix, --exit-non-zero-on-fix, --show-fixes]
    - id: ruff-format


- repo: https://github.com/ComPWA/taplo-pre-commit
  rev: v0.9.3
  hooks:
    - id: taplo-format
    - id: taplo-lint
