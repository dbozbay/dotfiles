# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
# after-startup-command = []
after-startup-command = [
  'exec-and-forget borders active_color=0xff0053BA inactive_color=0xff494d64 width=5.0'
]

# Start AeroSpace at login
start-at-login = true

# Reference: https://github.com/i3/i3/blob/next/etc/config

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
    inner.horizontal = 8
    inner.vertical =   8
    outer.left =       8
    outer.bottom =     8
    outer.top =        8
    outer.right =      8

[mode.main.binding]
		# Open apps
		alt-enter = 'exec-and-forget open -a /Applications/Ghostty.app'
		alt-a = 'exec-and-forget open -a /Applications/Safari.app'

    # Move focus (i3 wraps focus by default)
    alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
    alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
    alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
    alt-l = 'focus --boundaries-action wrap-around-the-workspace right'
		
		# Move windows
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Consider using 'join-with' command as a 'split' replacement if you want to enable
    # normalizations
    alt-minus = 'split horizontal'
    alt-slash = 'split vertical'

    alt-f = 'fullscreen'
    alt-s = 'layout v_accordion'
    alt-w = 'layout h_accordion'
    alt-e = 'layout tiles horizontal vertical' 
    alt-shift-space = 'layout floating tiling'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 10'

    alt-shift-c = 'reload-config'
    alt-r = 'mode resize'
		alt-equal = 'balance-sizes'


[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'


[[on-window-detected]]
    if.app-id = 'com.apple.Safari'
    run = 'move-node-to-workspace 1' 

[[on-window-detected]]
		if.app-id = 'com.tinyspeck.slackmacgap'
		run = 'move-node-to-workspace 2' 

[[on-window-detected]]
    if.app-id = 'com.microsoft.VSCode'
    run = 'move-node-to-workspace 3' 

[[on-window-detected]]
		if.app-id = 'com.mitchellh.ghostty'
		run = ['layout tiling', 'move-node-to-workspace 3']

[[on-window-detected]]
		if.app-id = 'com.apple.Terminal'
		run = 'move-node-to-workspace 3' 

[[on-window-detected]]
		if.app-id = 'com.apple.mail'
		run = 'move-node-to-workspace 4' 

[[on-window-detected]]
		if.app-id = 'com.spotify.client'
		run = 'move-node-to-workspace 10' 

[[on-window-detected]]
		if.app-id = 'com.apple.finder'
		run = ['layout floating']
